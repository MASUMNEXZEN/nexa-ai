<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexA AI — Clearing Cache...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #11152A;
      color: #F1F3FF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 50%;
      background: white;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(98,91,238,0.4);
    }
    .logo img { width: 60px; height: 60px; object-fit: contain; padding: 8px; }
    h1 { font-size: 22px; font-weight: 700; color: white; }
    h1 span { color: #625BEE; }
    p { font-size: 14px; color: #AEB6CA; }
    .progress {
      width: 200px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #625BEE, #6B6EF3);
      border-radius: 4px;
      width: 0%;
      animation: fill 2.5s ease forwards;
    }
    @keyframes fill { to { width: 100%; } }
    #status { font-size: 13px; color: #AEB6CA; min-height: 20px; }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/logo-icon.png?v=5" alt="NexA">
  </div>
  <h1>NexA <span>AI</span></h1>
  <div class="progress"><div class="progress-bar"></div></div>
  <p id="status">Clearing old cache...</p>

>
  <script src="/reset.js?v=1"></script>
</body>
</html>
