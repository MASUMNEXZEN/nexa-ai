<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NexA AI — Clearing Cache...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Outfit', system-ui, sans-serif;
      background: #08090f;
      color: #dce1f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
      text-align: center;
    }
    .logo {
      width: 72px; height: 72px; border-radius: 50%;
      background: white;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 40px rgba(230,35,53,0.4);
    }
    .logo img { width: 60px; height: 60px; object-fit: contain; padding: 8px; }
    h1 { font-size: 22px; font-weight: 700; color: white; }
    h1 span { color: #e62335; }
    p { font-size: 14px; color: #6b7592; }
    .progress {
      width: 200px; height: 4px; border-radius: 4px;
      background: rgba(255,255,255,0.08);
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #e62335, #4f6ef7);
      border-radius: 4px;
      width: 0%;
      animation: fill 2.5s ease forwards;
    }
    @keyframes fill { to { width: 100%; } }
    #status { font-size: 13px; color: #6b7592; min-height: 20px; }
  </style>
</head>
<body>
  <div class="logo">
    <img src="/logo.png?v=2" alt="NexA" onerror="this.src='/icon-512.png'">
  </div>
  <h1>NexA <span>AI</span></h1>
  <div class="progress"><div class="progress-bar"></div></div>
  <p id="status">Clearing old cache...</p>

  <script>
    const status = document.getElementById('status');
    async function nuke() {
      try {
        status.textContent = 'Unregistering Service Workers...';
        const regs = await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r => r.unregister()));

        status.textContent = 'Clearing all caches...';
        const keys = await caches.keys();
        await Promise.all(keys.map(k => caches.delete(k)));

        status.textContent = 'Done! Loading fresh NexA AI...';
        setTimeout(() => {
          window.location.replace('/?nocache=' + Date.now());
        }, 600);
      } catch(e) {
        status.textContent = 'Redirecting...';
        setTimeout(() => window.location.replace('/?nocache=' + Date.now()), 800);
      }
    }
    nuke();
  </script>
</body>
</html>
