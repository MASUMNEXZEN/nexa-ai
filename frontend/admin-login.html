<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NexA AI — Secure Admin Login</title>
  <meta name="theme-color" content="#08090f">
  
  <link rel="icon" href="/logo-icon.png">
  <link rel="stylesheet" href="/admin-style.css?v=2">
  <style>
    body {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 20px; overflow: hidden;
    }
    .login-card {
      width: 100%; max-width: 420px; padding: 40px;
      position: relative; z-index: 10;
      animation: slideUp 0.6s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes slideUp { from { opacity: 0; transform: translateY(40px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    
    .brand { text-align: center; margin-bottom: 32px; }
    .brand img { height: 64px; width: auto; margin-bottom: 24px; filter: drop-shadow(0 4px 16px var(--accent-glow)); }
    .brand h2 { font-size: 24px; font-weight: 700; color: #fff; letter-spacing: -0.5px; }
    .brand p { font-size: 14px; color: var(--text-muted); margin-top: 6px; }

    .form-group { margin-bottom: 20px; text-align: left; }
    .form-label { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); margin-bottom: 8px; }
    
    .input-wrapper { position: relative; }
    .input-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: 0.5; display: flex; align-items: center; color: var(--text); }
    .form-control {
      width: 100%; background: rgba(0,0,0,0.4); border: 1px solid var(--border);
      color: #fff; font-family: var(--font-sans); font-size: 15px; padding: 14px 16px 14px 44px;
      border-radius: 12px; transition: all 0.3s cubic-bezier(0.16,1,0.3,1); outline: none;
    }
    .form-control:focus { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); background: rgba(0,0,0,0.6); }

    .eye-btn { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; opacity: 0.5; color: var(--text); padding: 4px; display: flex; }
    .eye-btn:hover { opacity: 1; color: #fff; }

    .submit-btn { width: 100%; justify-content: center; padding: 16px; font-size: 15px; margin-top: 12px; }
    
    .back-link { display: block; text-align: center; margin-top: 24px; color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; transition: 0.2s; }
    .back-link:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="login-card glass-panel">
    <div class="brand">
      <img src="/logo.png?v=2" alt="NexA Logo" style="height:56px;width:auto;border-radius:12px;background:rgba(0,0,0,0.6);padding:6px;box-shadow:0 0 24px rgba(230,35,53,0.3);" onerror="this.style.display='none'">
      <h2>Restricted Access</h2>
      <p>NexA AI Platform Administration</p>
    </div>

    <div class="form-group">
      <label class="form-label">Admin Identity</label>
      <div class="input-wrapper">
        <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
        <input type="email" id="loginEmail" class="form-control" placeholder="admin@domain.com" autocomplete="email" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Passphrase</label>
      <div class="input-wrapper">
        <span class="input-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <input type="password" id="loginPass" class="form-control" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter') doLogin()">
        <button class="eye-btn" onclick="togglePass()" title="Show Password">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>

    <button class="btn btn-primary submit-btn" id="loginBtn" onclick="doLogin()">Authenticate Session</button>
    <a href="/" class="back-link">&larr; Return to AI Chat</a>
  </div>

  <div id="toast"></div>

  <script>
    function togglePass() {
      const el = document.getElementById('loginPass');
      el.type = el.type === 'password' ? 'text' : 'password';
    }

    // Auto redirect if already logged in
    fetch('/api/admin-check.php').then(r=>r.json()).then(d=>{ if(d.loggedIn) window.location.href='/admin'; }).catch(()=>{});

    async function doLogin() {
      const e = document.getElementById('loginEmail').value.trim();
      const p = document.getElementById('loginPass').value;
      if(!e || !p) return showToast('Identity and Passphrase required.', 'error');
      
      const btn = document.getElementById('loginBtn');
      btn.textContent = 'Verifying...'; btn.disabled = true;

      try {
        const res = await fetch('/api/admin-login.php', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({email:e, password:p})
        });
        const data = await res.json();
        if(res.ok && data.success) window.location.href = '/admin';
        else showToast(data.error || 'Authentication Failed', 'error');
      } catch(err) {
        showToast('Network timeout. SECURE CHANNEL OFFLINE.', 'error');
      } finally {
        btn.textContent = 'Authenticate Session'; btn.disabled = false;
      }
    }

    function showToast(msg, type='success') {
      const t = document.getElementById('toast');
      t.textContent = msg; t.className = 'show ' + type;
      clearTimeout(t._timer); t._timer = setTimeout(()=>t.className='', 3500);
    }
  </script>
</body>
</html>
