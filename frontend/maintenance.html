<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexA AI — Under Maintenance</title>
<link rel="icon" href="/logo-icon.png?v=4">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#11152A;font-family:'Segoe UI',system-ui,sans-serif;color:#F1F3FF;overflow:hidden}
.container{text-align:center;padding:40px 24px;max-width:520px;position:relative;z-index:2}
.logo{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid rgba(220,40,60,0.5);margin-bottom:24px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(220,40,60,0.3)}50%{box-shadow:0 0 40px rgba(220,40,60,0.6)}}
h1{font-size:28px;font-weight:700;margin-bottom:8px;background:linear-gradient(135deg,#7A78F5,#86A8FF);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:15px;color:#9a8fb8;margin-bottom:32px;line-height:1.5}
.card{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:28px 24px;backdrop-filter:blur(20px)}
.icon{margin-bottom:16px;display:flex;justify-content:center}.icon .nexa-icon{width:48px;height:48px}
.status{font-size:16px;font-weight:600;margin-bottom:8px}
.detail{font-size:13px;color:#8a7fa8;line-height:1.6}
.progress-bar{width:100%;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;margin-top:20px;overflow:hidden}
.progress-fill{height:100%;width:60%;background:linear-gradient(90deg,#7A78F5,#86A8FF);border-radius:2px;animation:loading 2s ease-in-out infinite}
@keyframes loading{0%{width:20%;opacity:0.5}50%{width:80%;opacity:1}100%{width:20%;opacity:0.5}}
.footer{margin-top:32px;font-size:12px;color:#5a4f78}
.bg-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0}
.orb1{width:300px;height:300px;background:radial-gradient(circle,rgba(220,40,60,0.15),transparent);top:-50px;right:-50px}
.orb2{width:250px;height:250px;background:radial-gradient(circle,rgba(100,60,180,0.12),transparent);bottom:-30px;left:-30px}
</style>
</head>
<body>
<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="container">
  <img src="/logo-icon.png?v=4" alt="NexA" class="logo">
  <h1>NexA AI</h1>
  <p class="subtitle">Built by NexZen Institute</p>
  <div class="card">
    <span class="icon"><span data-icon="wrench" aria-hidden="true"></span></span>
    <div class="status">Under Maintenance</div>
    <p class="detail">We're upgrading NexA AI to serve you better.<br>This won't take long — please check back shortly!</p>
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>
  <p class="footer">© 2026 NexZen Institute, Kolkata</p>
</div>
  <script src="/nexa-icons.js?v=1"></script>
</body>
</html>
